<div class="page">
  <div class="header">🤖 Assistant Boutique IA</div>

  <div class="messages">
    @for (m of messages(); track $index) {
      <div class="msg" [class.user]="m.role === 'user'">{{ m.text }}</div>
    }
    @if (busy()) {
      <div class="msg">L'agent réfléchit... {{ seconds() }} s</div>
    }
  </div>

  <div class="quick">
    <button [disabled]="busy()" (click)="ask('Quels sont vos produits ?')">Tous les produits</button>
    <button [disabled]="busy()" (click)="ask('Avez-vous des ecrans ?')">Ecrans</button>
    <button [disabled]="busy()" (click)="ask('Quel est le prix moyen de vos articles ?')">Statistiques</button>
  </div>

  <form class="form" (submit)="ask(input); $event.preventDefault()">
    <input name="input" [(ngModel)]="input" [disabled]="busy()"
           placeholder="Votre question..." autocomplete="off">
    <button type="submit" [disabled]="busy()">Envoyer</button>
  </form>
</div>
